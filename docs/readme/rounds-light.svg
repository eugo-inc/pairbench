<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="596" viewBox="0 0 1200 596" role="img" aria-labelledby="title desc">
<title id="title">Paired, alternating rounds with a twin of every side</title>
<desc id="desc">Eight rounds of one plan for two sides, new and old. Each round runs new, its twin new~same, old, its twin old~same, and the positive control old~twice. The order rotates and reverses from round to round and the positive control runs last. The gap between a side and its twin is the noise floor; new and old are paired round by round for the sign test; old~twice must read as twice old.</desc>
<style>.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style>
