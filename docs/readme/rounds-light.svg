<text x="48" y="96" class="s" font-size="17" fill="#55566b">One plan for two sides, as pairbench plan prints it: every entry runs once per round, the order rotates and reverses,</text>
<text x="48" y="120" class="s" font-size="17" fill="#55566b">and the positive control runs last.</text>
