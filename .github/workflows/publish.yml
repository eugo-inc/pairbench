name: publish

# Uploads a release's wheel and sdist to PyPI through trusted publishing, so
# no token is stored. It uploads the files attached to the GitHub release, as
# they were built and checked; the release must list their sha256 sums in
# SHA256SUMS.txt. Before the upload, a job with no special permissions builds
# the same two files again from the release's tag with the pinned build
# backend, and the upload goes ahead only when the attached files are those
# files, byte for byte. A prerelease is not uploaded.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  rebuild:
    name: build again from the tag
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sums: ${{ steps.sums.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned build backend
        run: |
          python -m pip install --only-binary :all: \
            "build==1.6.1" "pyproject_hooks==1.3.3" "hatchling==1.33.0" \
            "packaging==26.3" "pathspec==1.1.1" "pluggy==1.7.0" "tomlkit==0.15.2" \
            "trove-classifiers==2026.9.21.13"
      - name: Build the wheel and the sdist
        run: python -m build --no-isolation --outdir dist .
      - name: Check that the files carry the tag's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          cd dist
          test "$(ls | wc -l)" = 2
          test -f "pairbench-${version}-py3-none-any.whl"
          test -f "pairbench-${version}.tar.gz"
      - id: sums
        name: Hand on the sha256 sums of the built files
        run: |
          cd dist
          echo "sums=$(sha256sum -- * | sort -k 2 | base64 -w 0)" >> "$GITHUB_OUTPUT"
          sha256sum -- *

  pypi:
    name: upload to PyPI
    needs: rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/pairbench/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.whl' --pattern '*.tar.gz' --pattern 'SHA256SUMS.txt'
          cd dist
          test "$(ls *.whl | wc -l)" = 1
          test "$(ls *.tar.gz | wc -l)" = 1
          sha256sum --check --strict SHA256SUMS.txt
          rm SHA256SUMS.txt
          ls -l
      - name: Check that the release files are the files built from the tag
        env:
          BUILT: ${{ needs.rebuild.outputs.sums }}
        run: |
          test -n "$BUILT"
          cd dist
          echo "$BUILT" | base64 -d > ../built.txt
          sha256sum -- * | sort -k 2 > ../attached.txt
          diff ../built.txt ../attached.txt
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
