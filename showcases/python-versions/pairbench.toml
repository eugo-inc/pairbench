# Two official Python images, one standard-library workload. This folder is
# mounted at /showcase, read-only, in every launch.

[workload]
argv = ["python", "/showcase/bench.py"]
driver = "lines"

[sides.py313]
image = "python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90"
baseline = true

[sides.py314]
image = "python:3.14-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f"

[launch]
memory = "2g"
env = { PYTHONDONTWRITEBYTECODE = "1" }
identify = ["python", "-c", "import sys, sysconfig; print(sys.version); print(sysconfig.get_config_var('CONFIG_ARGS'))"]

[controls]
positive_via = "factor"
