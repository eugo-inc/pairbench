# The images of this showcase, each pinned by the digest of its multi-platform
# index, as the registry gave it for the tag. pairbench.toml names the same
# references. The pip side's package is pinned in run.sh.

[sides.pip]
image = "docker.io/library/python:3.13-slim"
digest = "sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90"
packages = ["torch==2.15.0 (pip, from PyPI)"]

[sides.vendor]
image = "nvcr.io/nvidia/pytorch:26.10-py3"
digest = "sha256:6d347d649d5dd108b4652f1b9cea6a3c859692ac408617a9108616da40e3da1f"
packages = ["PyTorch 2.15.0a0+875d815, as the image's PYTORCH_VERSION variable names it"]
